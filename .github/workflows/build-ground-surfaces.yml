name: build ground-surfaces

# Builds and pushes ghcr.io/bradleylab/ground-surfaces.
# Triggers:
#   - pull requests touching ground-surfaces/** -> build + smoke only (no push)
#   - push to main when ground-surfaces/** changes -> :latest
#   - tag matching ground-surfaces-v* -> :vN and :latest
#   - manual dispatch with a version_tag input

on:
  push:
    branches: [main]
    paths:
      - 'ground-surfaces/**'
      - '.github/workflows/build-ground-surfaces.yml'
    tags:
      - 'ground-surfaces-v*'
  pull_request:
    paths:
      - 'ground-surfaces/**'
      - '.github/workflows/build-ground-surfaces.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Stable version tag (e.g. v1) — empty = latest only'
        required: false
        default: ''

env:
  IMAGE_NAME: bradleylab/ground-surfaces
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          # Tag-driven release: refs/tags/ground-surfaces-vN
          if [[ "${GITHUB_REF}" == refs/tags/ground-surfaces-v* ]]; then
            VTAG="${GITHUB_REF#refs/tags/ground-surfaces-}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VTAG}"
          fi
          # Manual dispatch with version_tag
          if [[ -n "${{ github.event.inputs.version_tag }}" ]]; then
            VTAG="${{ github.event.inputs.version_tag }}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VTAG}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "computed tags: ${TAGS}"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ground-surfaces
          file: ground-surfaces/Dockerfile
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Smoke test
        # Synthetic clouds with known surfaces, run through the three contract
        # options; also the refusals. A failure stops the job before the push.
        run: |
          IMAGE="$(cut -d, -f1 <<<"${{ steps.tags.outputs.tags }}")"
          docker run --rm \
            -v "${{ github.workspace }}/ground-surfaces/tests:/tests:ro" \
            --entrypoint python \
            "${IMAGE}" /tests/smoke.py

      - name: Contract entrypoint
        # The image's own ENTRYPOINT, given only the three options, as a
        # compute provider runs it, and with a host's PATH rather than the
        # image's: a job step on Compute2 carries the host's, so the entrypoint
        # must not need /opt/conda/bin on PATH to start.
        run: |
          IMAGE="$(cut -d, -f1 <<<"${{ steps.tags.outputs.tags }}")"
          WORK="${{ runner.temp }}/contract"
          mkdir -p "${WORK}"
          docker run --rm \
            -v "${{ github.workspace }}/ground-surfaces/tests:/tests:ro" \
            -v "${WORK}:/work" \
            --entrypoint python \
            "${IMAGE}" /tests/smoke.py --fixtures-only /work
          docker run --rm -v "${WORK}:/work" \
            -e PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "${IMAGE}" \
            --input-dir /work/cases/classify/input \
            --output-dir /work/out \
            --params-json /work/cases/classify/params.json
          test -s "${WORK}/out/run.json"
          echo "manifest written by the entrypoint:"
          cat "${WORK}/out/run.json"

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ground-surfaces
          file: ground-surfaces/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## ground-surfaces image built" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tags pushed:" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          for t in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do
            echo "- \`${t}\`" >> "${GITHUB_STEP_SUMMARY}"
          done
