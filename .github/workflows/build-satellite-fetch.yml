name: build satellite-fetch

# Builds and pushes ghcr.io/bradleylab/satellite-fetch.
# Triggers:
#   - pull requests touching satellite-fetch/** -> build + smoke only (no push)
#   - push to main when satellite-fetch/** changes -> :latest
#   - tag matching satellite-fetch-v* -> :vN and :latest
#   - manual dispatch with a version_tag input

on:
  push:
    branches: [main]
    paths:
      - 'satellite-fetch/**'
      - '.github/workflows/build-satellite-fetch.yml'
    tags:
      - 'satellite-fetch-v*'
  pull_request:
    paths:
      - 'satellite-fetch/**'
      - '.github/workflows/build-satellite-fetch.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Stable version tag (e.g. v1) — empty = latest only'
        required: false
        default: ''

env:
  IMAGE_NAME: bradleylab/satellite-fetch
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          # Tag-driven release: refs/tags/satellite-fetch-vN
          if [[ "${GITHUB_REF}" == refs/tags/satellite-fetch-v* ]]; then
            VTAG="${GITHUB_REF#refs/tags/satellite-fetch-}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VTAG}"
          fi
          # Manual dispatch with version_tag
          if [[ -n "${{ github.event.inputs.version_tag }}" ]]; then
            VTAG="${{ github.event.inputs.version_tag }}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VTAG}"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "computed tags: ${TAGS}"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: satellite-fetch
          file: satellite-fetch/Dockerfile
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Smoke test
        # The recipe's offline half with synthetic inputs whose answers are
        # known: parameters, the output grid, the clear-sky rules, the
        # Sentinel-2 offset, merging, and the COG written. A failure stops the
        # job before the push. The network half runs in the fixture on Compute2.
        run: |
          IMAGE="$(cut -d, -f1 <<<"${{ steps.tags.outputs.tags }}")"
          docker run --rm \
            -v "${{ github.workspace }}/satellite-fetch/tests:/tests:ro" \
            --entrypoint python \
            "${IMAGE}" /tests/smoke.py

      - name: Contract entrypoint
        # The image's own ENTRYPOINT, given only the three options, as a
        # compute provider runs it, and with a host's PATH rather than the
        # image's: a job step on Compute2 carries the host's, so the entrypoint
        # must not need /opt/conda/bin on PATH to start. The site is too large
        # to fetch for, so the run is refused before any network call, with the
        # contract's exit status 2.
        run: |
          IMAGE="$(cut -d, -f1 <<<"${{ steps.tags.outputs.tags }}")"
          WORK="${{ runner.temp }}/contract"
          mkdir -p "${WORK}"
          docker run --rm \
            -v "${{ github.workspace }}/satellite-fetch/tests:/tests:ro" \
            -v "${WORK}:/work" \
            --entrypoint python \
            "${IMAGE}" /tests/smoke.py --fixtures-only /work
          set +e
          docker run --rm -v "${WORK}:/work" \
            -e PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "${IMAGE}" \
            --input-dir /work/cases/too_large/input \
            --output-dir /work/out \
            --params-json /work/cases/too_large/params.json 2> "${WORK}/stderr.txt"
          status=$?
          set -e
          cat "${WORK}/stderr.txt"
          test "${status}" -eq 2
          grep -q "the limit is 25 km" "${WORK}/stderr.txt"

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: satellite-fetch
          file: satellite-fetch/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## satellite-fetch image built" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tags pushed:" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          for t in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do
            echo "- \`${t}\`" >> "${GITHUB_STEP_SUMMARY}"
          done
